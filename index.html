<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>小精靈在養魚</title>
    <link rel="stylesheet" href="style.css">

<body>

    <!-- 頂部導覽列 -->
    <header>
        <div class="header-container">
            <a href="#" class="logo">ShoalBiz 魚樂圈</a>
            
            <!-- 手機版漢堡按鈕 -->
            <button class="hamburger-btn" id="hamburgerToggle" aria-label="選單">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- 導覽列分頁按鈕 -->

                    <li><button class="tab-btn active" data-target="section1">用具</button></li>
                    <li><button class="tab-btn" data-target="section2">藥水</button></li>
                    <li><button class="tab-btn" data-target="section3">科普</button></li>

            </nav>
        </div>
    </header>

    <main>
        <!-- ==================== 用具區 ==================== -->
        <section id="section1" class="section-content active">
            <div class="section-top-bar">
                <h1 class="section-title">用具</h1>
            </div>

            <!-- 網格卡片區：電腦 3 欄 -> 平板 2 欄 -> 手機 1 欄，自動換行往下排 -->

                <article class="card-item" 
                    data-img="https://aquaforestaquarium.com/cdn/shop/products/Pro-Scissors-Short_St_086A0566_1024x1024.jpg?v=1618809754"
                    data-tag="剪刀"
                    data-code="¥8,800 / 170 mm . 貨號106-072"
                    data-title="PRO-SCISSORS SHORT"
                    data-jp="ストレートタイプ。植栽前の水草の下処理や、刃が大きく開くため、広い面積のトリミング向き。"
                    data-zh="直線型刀刃。用於種植水草前的修整，也可以修剪大面積的水草。※【刃が大きく開く】=刀刃可大幅張開。">
                    <div class="card-thumb">
                        <img src="https://aquaforestaquarium.com/cdn/shop/products/Pro-Scissors-Short_St_086A0566_1024x1024.jpg?v=1618809754" alt="">
                    </div>
                    <h2 class="card-title">PRO-SCISSORS SHORT｜短型水草剪</h2>
                    <div class="card-meta">
                        <span class="meta-tag">剪刀</span>
                        <span class="meta-code">¥8,800</span>
                    </div>
                </article>

                <!-- 第 2 張卡片 -->
                 <article class="card-item" 
                    data-img="https://aquaforestaquarium.com/cdn/shop/products/Trimming_Scissors_St_1024x1024.jpg?v=1618811273"
                    data-tag="剪刀"
                    data-code="¥9,680 / 255mm . 貨號106-068"
                    data-title="PRO-SCISSORS"
                    data-jp="ストレートタイプ。柄部が長く、水草のトリミング作業がしやすい形状です。"
                    data-zh="直線型刀刃。因為柄比較長，手可以在水族箱外操作，刀刃能夠伸到比較深的位置，因此比較方便修剪缸內水草。">
                    <div class="card-thumb">
                        <img src="https://aquaforestaquarium.com/cdn/shop/products/Trimming_Scissors_St_1024x1024.jpg?v=1618811273" alt="">
                    </div>
                    <h2 class="card-title">PRO-SCISSORS｜水草剪</h2>
                    <div class="card-meta">
                        <span class="meta-tag">剪刀</span>
                        <span class="meta-code">¥9,680</span>
                    </div>
                </article>


                <!-- 第 3 張卡片 -->
                <article class="card-item" 
                    data-img="https://img.icons8.com/deco-glyph/1200/under-construction.jpg"
                    data-tag="類別"
                    data-code="¥價錢 / 尺寸000mm . 貨號000-000"
                    data-title="產品名稱"
                    data-jp="原文介紹"
                    data-zh="中文介紹">
                    <div class="card-thumb">
                        <img src="https://img.icons8.com/deco-glyph/1200/under-construction.jpg" alt="">
                    </div>
                    <h2 class="card-title">產品名稱｜適合..</h2>
                    <div class="card-meta">
                        <span class="meta-tag">類別</span>
                        <span class="meta-code">¥價錢</span>
                    </div>
                </article>

                <!-- 第 4 張卡片 (電腦版會自動換到第二排第一個) -->
                <article class="card-item" 
                    data-img="https://img.icons8.com/deco-glyph/1200/under-construction.jpg"
                    data-tag="類別"
                    data-code="¥價錢 / 尺寸000mm . 貨號000-000"
                    data-title="產品名稱"
                    data-jp="原文介紹"
                    data-zh="中文介紹">
                    <div class="card-thumb">
                        <img src="https://img.icons8.com/deco-glyph/1200/under-construction.jpg" alt="">
                    </div>
                    <h2 class="card-title">產品名稱｜適合..</h2>
                    <div class="card-meta">
                        <span class="meta-tag">類別</span>
                        <span class="meta-code">¥價錢</span>
                    </div>
                </article>

            </div>
        </section>

        <!-- ==================== 藥水區 ==================== -->
        <section id="section2" class="section-content">
            <div class="section-top-bar">
                <h1 class="section-title">藥水</h1>
            </div>

            <div class="card-grid">
                <article class="card-item" 
                    data-img="https://img.icons8.com/deco-glyph/1200/under-construction.jpg"
                    data-tag="類別"
                    data-code="¥價錢 / 尺寸000mm . 貨號000-000"
                    data-title="產品名稱"
                    data-jp="原文介紹"
                    data-zh="中文介紹">
                    <div class="card-thumb">
                        <img src="https://img.icons8.com/deco-glyph/1200/under-construction.jpg" alt="">
                    </div>
                    <h2 class="card-title">產品名稱｜適合..</h2>
                    <div class="card-meta">
                        <span class="meta-tag">類別</span>
                        <span class="meta-code">¥價錢</span>
                    </div>
                </article>
            </div>
        </section>

        <!-- ==================== 科普區 ==================== -->
        <section id="section3" class="section-content">
            <div class="section-top-bar">
                <h1 class="section-title">科普</h1>
            </div>

            <div class="card-grid">
                <article class="card-item" 
                    data-img="https://img.icons8.com/deco-glyph/1200/under-construction.jpg"
                    data-tag="類別"
                    data-code="¥價錢 / 尺寸000mm . 貨號000-000"
                    data-title="產品名稱"
                    data-jp="原文介紹"
                    data-zh="中文介紹">
                    <div class="card-thumb">
                        <img src="https://img.icons8.com/deco-glyph/1200/under-construction.jpg" alt="">
                    </div>
                    <h2 class="card-title">產品名稱｜適合..</h2>
                    <div class="card-meta">
                        <span class="meta-tag">類別</span>
                        <span class="meta-code">¥價錢</span>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>Copyright © 2026 ShoalBiz 魚樂圈.All Rights Reserved</p>
    </footer>

    <!-- ==================== 點擊卡片後的詳細內容彈窗 (Modal) ==================== -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-container">
            <button class="modal-close" id="closeModalBtn" aria-label="關閉">✕</button>
            
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modalImg" src="" alt="">
                </div>
                
                <div class="modal-info">
                    <div class="modal-meta">
                        <span class="meta-tag" id="modalTag">TAG</span>
                        <span class="meta-code" id="modalCode">PRICE</span>
                    </div>
                    <h2 class="modal-title" id="modalTitle">標題</h2>
                    
                    <div class="lang-section">
                        <span class="lang-badge">原文</span>
                        <p id="modalJpText" class="jp-desc"></p>
                    </div>

                    <div class="lang-section">
                        <span class="lang-badge">繁體中文</span>
                        <p id="modalZhText" class="zh-desc"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 互動腳本 -->
    <script>
        const tabButtons = document.querySelectorAll('.tab-btn');
        const sections = document.querySelectorAll('.section-content');
        const hamburgerToggle = document.getElementById('hamburgerToggle');
        const navMenu = document.getElementById('navMenu');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                tabButtons.forEach(btn => btn.classList.remove('active'));
                sections.forEach(sec => sec.classList.remove('active'));

                button.classList.add('active');
                const targetId = button.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');

                navMenu.classList.remove('open');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });

        hamburgerToggle.addEventListener('click', () => {
            navMenu.classList.toggle('open');
        });

        const cardItems = document.querySelectorAll('.card-item');
        const detailModal = document.getElementById('detailModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        cardItems.forEach(card => {
            card.addEventListener('click', () => {
                document.getElementById('modalImg').src = card.getAttribute('data-img');
                document.getElementById('modalTag').textContent = card.getAttribute('data-tag');
                document.getElementById('modalCode').textContent = card.getAttribute('data-code');
                document.getElementById('modalTitle').textContent = card.getAttribute('data-title');
                document.getElementById('modalJpText').textContent = card.getAttribute('data-jp');
                document.getElementById('modalZhText').textContent = card.getAttribute('data-zh');

                detailModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });

        function closeModal() {
            detailModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeModalBtn.addEventListener('click', closeModal);
        detailModal.addEventListener('click', (e) => {
            if (e.target === detailModal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
